provider: Defense Health Agency
providerId: defense-health-agency
description: >-
  Standards the Defense Health Agency states it participates in or exchanges data under,
  read from DHA's own public pages and from a DHA-published SBIR topic. NOTHING HERE WAS
  READ FROM A CONTRACT — no OpenAPI, FHIR CapabilityStatement, WSDL or GraphQL SDL is
  publicly reachable for any DHA surface (see x-coverage in apis.yml), so every entry
  below is a DOCUMENTED CLAIM by the agency, not a machine-verified conformance.
  The `contract_verified` field on each entry says which it is.
caveat: >-
  A documented claim and a conformant contract are different facts. Recording the
  difference is the point of this file: a buyer who already speaks FHIR still cannot
  confirm from anything DHA publishes which FHIR release, profiles, or resources the
  MHS GENESIS interface exposes.
conformance:
  - id: ehealth-exchange
    label: eHealth Exchange
    conforms: true
    contract_verified: false
    evidence: https://www.health.mil/Military-Health-Topics/Technology/Joint-HIE
    note: >-
      DHA's Joint Health Information Exchange page states health data is shared "through
      the eHealth Exchange, CommonWell Health Alliance, and Carequality."
  - id: commonwell
    label: CommonWell Health Alliance
    conforms: true
    contract_verified: false
    evidence: https://www.health.mil/Military-Health-Topics/Technology/Joint-HIE
    note: Named on the same Joint HIE page as an exchange network DHA participates in.
  - id: carequality
    label: Carequality
    conforms: true
    contract_verified: false
    evidence: https://www.health.mil/Military-Health-Topics/Technology/Joint-HIE
    note: >-
      "In August 2023, the Federal Electronic Health Record Modernization office expanded
      its joint health information exchange to include participation in Carequality, a
      framework enabling health data sharing between and among networks."
  - id: smart-on-fhir
    label: SMART on FHIR
    conforms: true
    contract_verified: false
    evidence: https://www.sbir.gov/topics/11133
    note: >-
      A DHA-published SBIR topic states "MHS Genesis (Cerner) SMART on FHIR API will be
      provided for data ingress/egress and must be able to retrieve information from the
      EHR when queried." No launch URL, scope list, or .well-known/smart-configuration is
      published — the probe of
      patientportal.mhsgenesis.health.mil/.well-known/smart-configuration returned 404.
  - id: fhir
    label: HL7 FHIR
    conforms: true
    contract_verified: false
    evidence: https://www.sbir.gov/topics/11133
    note: >-
      Implied by the SMART on FHIR statement above and by MHS GENESIS running on Oracle
      Health (Cerner) Millennium, whose public FHIR release is R4. DHA itself never states
      a FHIR release, and MHS GENESIS does NOT appear in Oracle Health's public
      patient-access endpoint directory (oracle-samples/ignite-endpoints,
      millennium_patient_r4_endpoints.json, checked 2026-09-07 — the only "GENESIS" match
      is GENESIS HEALTH SYSTEM, an unrelated Iowa health system), so no DHA FHIR service
      root is publicly discoverable.
  - id: oauth2
    label: OAuth 2.0
    conforms: false
    contract_verified: false
    evidence: https://www.health.mil/.well-known/oauth-authorization-server
    note: >-
      404. SMART on FHIR implies an OAuth 2.0 authorization server exists behind the DoD
      boundary, but no authorization-server metadata is served on any public DHA host.
  - id: openid-connect
    label: OpenID Connect
    conforms: false
    contract_verified: false
    evidence: https://www.health.mil/.well-known/openid-configuration
    note: 404 — no OIDC discovery document on any public DHA host.
domain_standard:
  sector: health
  candidates_checked: [fhir, smart-on-fhir, us-core, uscdi, da-vinci, carin-blue-button,
                       fhir-bulk-data, cds-hooks, c-cda, hl7-v2, dicom]
  declared_in_contract: false
  note: >-
    `domain_standard_conformance` reads the CONTRACT, not a marketing page, and there is
    no fetchable DHA contract to read. FHIR and SMART on FHIR are recorded above as
    documented claims only. No US Core / USCDI / Da Vinci / CARIN / bulk-data / CDS Hooks
    / C-CDA / HL7 v2 / DICOM claim was found on any public DHA page, and none was invented
    to fill the slot.
