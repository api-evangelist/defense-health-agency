description: >-
  The Defense Health Agency publishes no API plans, tiers, quotas or pricing of any kind.
  DHA is a U.S. Department of Defense combat support agency, not a commercial API vendor:
  access to MHS GENESIS interfaces and to MHS Data Repository / M2 data is granted by
  agreement and account request (DAD IO J-6, Common Access Card required), not by
  purchasing a plan. plan_count is 0 and that is the finding, not a gap in this profile.
plan_count: 0
plans: []
access_model:
  model: request-and-agreement
  note: >-
    Access to MHS GENESIS SMART on FHIR is restricted to vetted DoD application partners.
    MDR and M2 accounts are requested through DHA using the published access forms and the
    CAC-gated DAD IO J-6 portal at info.health.mil. No self-service signup, no price list,
    no metered tier exists.
  evidence:
    - url: https://health.mil/Military-Health-Topics/Technology/Support-Areas/MDR-M2-ICD-Functional-References-and-Specification-Documents
      status: 200
      note: Publishes the MDR SAS Computing Environment Access Instructions and M2 Account Access Guide.
    - url: https://mobile.health.mil/About-DHA-Library
      status: 200
      note: >-
        Names the DAD IO J-6 request portal (https://info.health.mil/apps/HIT/services/SitePages/escMenu.aspx)
        and states a Common Access Card is required.
supersedes:
  note: >-
    This file replaces a 2026-05-04 bulk-sweep scaffold that asserted Free / Professional /
    Enterprise tiers with a $0 1,000-request free quota, a 10 req/min rate limit and
    "TBD" overage pricing. None of that was published by DHA; it was template default
    content. Removed 2026-09-07 under the no-fabrication rule.
